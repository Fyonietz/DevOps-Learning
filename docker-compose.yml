services:
  backend:
    image: ghcr.io/fyonietz/devops-learning-backend:latest
    container_name: devops-backend
    restart: unless-stopped
    environment:
      - ASPNETCORE_ENVIRONMENT=Production
      - Cors__AllowedOrigins__0=${APP_ORIGIN:-http://localhost:8080}
    expose:
      - "3000"

  frontend:
    image: ghcr.io/fyonietz/devops-learning-frontend:latest
    container_name: devops-frontend
    restart: unless-stopped
    environment:
      - PORT=5000
      - BACKEND_URL=http://backend:3000
    expose:
      - "5000"
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: devops-nginx
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - frontend
